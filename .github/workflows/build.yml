      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 만들기
        working-directory: app-src
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp app-src/app/build/outputs/apk/debug/app-debug.apk DocScan.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 문서스캔 ${{ github.run_number }}번째 빌드
          body: 아래 Assets에서 DocScan.apk를 눌러 폰에 내려받아 설치하세요.
          files: DocScan.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: DocScan-apk
          path: DocScan.apk
