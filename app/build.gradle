plugins {
    id 'com.android.application'
}

android {
    namespace 'com.docscan.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.docscan.app'
        minSdk 26
        targetSdk 34
        def run = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode Integer.parseInt(run)
        versionName "1.0.${run}"
        // 폴드8 등 최신 폰(64비트 ARM)용만 넣어 앱 크기를 줄임
        ndk { abiFilters 'arm64-v8a' }
    }

    // 매번 같은 열쇠로 서명해야 새 버전이 기존 앱 위에 덮여 설치된다
    signingConfigs {
        debug {
            storeFile file('docscan.keystore')
            storePassword 'docscan2026'
            keyAlias 'docscan'
            keyPassword 'docscan2026'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 라이브러리들이 서로 다른 코틀린 런타임을 끌어와 충돌하는 것을 정리
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && (details.requested.name == 'kotlin-stdlib-jdk7'
                 || details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
    implementation "androidx.camera:camera-view:${camerax}"
    implementation 'com.google.guava:listenablefuture:1.0'
    // 문서 테두리 인식
    implementation 'org.opencv:opencv:4.10.0'
}
